services:
  postgres:
    image: postgres:17
    
    restart: unless-stopped

    ports:
      - "5432:5432"
    
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpass
      POSTGRES_DB: shortener_db
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d shortener_db"]
      interval: 5s
      timeout: 30s
      retries: 5

    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate

    depends_on:
      postgres:
        condition: service_healthy
    
    volumes:
      - ./migrations:/migrations

    command: [ 
      "-path", 
      "/migrations", 
      "-database", 
      "postgres://pguser:pgpass@postgres:5432/shortener_db?sslmode=disable", 
      "up"
    ]

  shortener:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_DSN: postgres://pguser:pgpass@postgres:5432/shortener_db?sslmode=disable
    ports:
      - "8080:8080"

volumes:
  pgdata: